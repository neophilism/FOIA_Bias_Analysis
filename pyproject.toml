[project]
name = "foia-bias-analysis"
version = "0.1.0"
description = "Automated pipeline for measuring partisan bias in FOIA disclosures"
authors = [{name = "FOIA Bias Analysis contributors"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML==6.0.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["foia_bias*"]

